<svg xmlns="http://www.w3.org/2000/svg" width="640" height="112" viewBox="0 0 640 112" role="img" aria-labelledby="route-title route-description">
  <title id="route-title">A small learning route</title>
  <desc id="route-description">Read, run, edit, check, then reflect. Repeat at your own pace.</desc>
  <rect width="640" height="112" rx="12" fill="#132336"/>
  <path d="M64 38H576" stroke="#f4f0e7" stroke-width="2"/>
  <g fill="#f4f0e7" font-family="sans-serif" font-size="16" text-anchor="middle">
  <circle cx="64" cy="38" r="7" fill="#132336" stroke="#f4f0e7" stroke-width="2"/>
  <text x="64" y="74">Read</text>
  <circle cx="192" cy="38" r="7" fill="#132336" stroke="#f4f0e7" stroke-width="2"/>
  <text x="192" y="74">Run</text>
  <circle cx="320" cy="38" r="7" fill="#132336" stroke="#f4f0e7" stroke-width="2"/>
  <text x="320" y="74">Edit</text>
  <circle cx="448" cy="38" r="7" fill="#132336" stroke="#f4f0e7" stroke-width="2"/>
  <text x="448" y="74">Check</text>
  <circle cx="576" cy="38" r="7" fill="#132336" stroke="#f4f0e7" stroke-width="2"/>
  <text x="576" y="74">Reflect</text>
  </g>
</svg>
